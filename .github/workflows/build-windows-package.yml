name: Build Windows Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "phiên-bản-chưa-sửa-ux-ui"

jobs:
  build-windows-package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ClearCord.Frontend/package-lock.json

      - name: Create package
        shell: pwsh
        run: ./scripts/publish-windows.ps1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ClearCord-win-x64
          path: artifacts/ClearCord-win-x64.zip
          if-no-files-found: error
